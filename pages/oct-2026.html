<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WilliamEst 行程日历 - 2026年10月</title>
    <link rel="stylesheet" href="../css/calendar.css">
</head>
<body>

<div class="app-container">
    <div style="text-align: left; margin-bottom: 20px;">
        <a href="calendar.html" style="text-decoration: none; color: #7f8c8d; font-weight: 600; font-size: 15px;">← 返回</a>
    </div>

    <div class="calendar-wrapper">
        <div class="calendar-title">WilliamEst 行程日历</div>
        <div class="calendar-month">2026年10月</div>
        
        <div class="calendar-grid" id="calendar-grid">
            <div class="weekday">日</div>
            <div class="weekday">一</div>
            <div class="weekday">二</div>
            <div class="weekday">三</div>
            <div class="weekday">四</div>
            <div class="weekday">五</div>
            <div class="weekday">六</div>
            <!-- 日历格子会由 JavaScript 自动生成 -->
        </div>
    </div>

    <!-- 行程详情展示区 -->
    <div class="event-area" id="event-area">
        <!-- 详情卡片会由 JavaScript 自动生成 -->
    </div>

    <div class="footer">
        © 2026 WilliamEst行程 | Contact: <strong>TrillPineyew</strong>
    </div>
</div>

<!-- 引入数据文件 -->
<script src="../js/data.js"></script>

<!-- 生成日历和行程的脚本 -->
<script>
    // 1. 配置当月信息
    const currentMonth = "oct-2026";  // 对应 data.js 里的键
    const monthTitle = "2026年10月";
    const startDay = 4; // 10月1日是周四（周日=0, 周一=1, ..., 周四=4）

    // 2. 获取数据
    const monthData = scheduleData[currentMonth] || {};

    // 3. 生成日历格子
    const calendarGrid = document.getElementById('calendar-grid');
    
    // 补全月初的空白格子
    for (let i = 0; i < startDay; i++) {
        calendarGrid.innerHTML += `<div class="day-cell" style="visibility: hidden;"></div>`;
    }

    // 生成 1-31 日
    for (let day = 1; day <= 31; day++) {
        const dayStr = day.toString();
        const hasEvent = monthData[dayStr] && monthData[dayStr].length > 0;
        
        if (hasEvent) {
            calendarGrid.innerHTML += `
                <div style="position: relative;">
                    <input type="checkbox" id="event-${day}">
                    <label for="event-${day}" class="day-cell has-event">${day}</label>
                </div>
            `;
        } else {
            calendarGrid.innerHTML += `<div class="day-cell">${day}</div>`;
        }
    }

    // 4. 生成行程详情区
    const eventArea = document.getElementById('event-area');
    for (const day in monthData) {
        const events = monthData[day];
        let eventHtml = `<div class="event-detail" id="detail-${day}">
            <h3>${monthTitle.replace('月', '月')}${day}日</h3>`;
        
        events.forEach(ev => {
            eventHtml += `<div class="event-item">`;
            if (ev.title) eventHtml += `<p><strong>${ev.title}</strong></p>`;
            if (ev.time) eventHtml += `<p>${ev.time}</p>`;
            eventHtml += `</div>`;
        });

        eventHtml += `</div>`;
        eventArea.innerHTML += eventHtml;
    }

    // 5. 交互逻辑（点击日期，显示对应详情，并取消其他选中）
    const checkboxes = document.querySelectorAll('input[type="checkbox"]');
    checkboxes.forEach(box => {
        box.addEventListener('change', function() {
            const clickedId = this.id;
            const isChecked = this.checked;

            document.querySelectorAll('label.day-cell').forEach(label => {
                label.classList.remove('active');
            });
            checkboxes.forEach(cb => { cb.checked = false; });
            document.querySelectorAll('.event-detail').forEach(detail => {
                detail.style.display = 'none';
            });

            if (isChecked) {
                const currentBox = document.getElementById(clickedId);
                if (currentBox) currentBox.checked = true;

                const currentLabel = document.querySelector(`label[for="${clickedId}"]`);
                if (currentLabel) currentLabel.classList.add('active');

                const detailId = 'detail-' + clickedId.split('-')[1];
                const targetDetail = document.getElementById(detailId);
                if (targetDetail) targetDetail.style.display = 'block';
            }
        });
    });
</script>

</body>
</html>
